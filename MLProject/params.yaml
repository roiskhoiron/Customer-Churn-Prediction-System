model:
  name: churn_model
  type: RandomForestClassifier
  params:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    class_weight: balanced
    n_jobs: -1

data:
  raw_path: ../data/wa_customer_churn_total.csv
  test_size: 0.2
  random_state: 42
  smote_strategy: 0.5

features:
  ordinal:
    - gender
    - Partner
    - Dependents
    - PhoneService
    - PaperlessBilling
  nominal:
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaymentMethod
  engineered:
    - ChargesPerMonth
    - TenureBin
    - Contract_x_Internet
    - SeniorPartner

target: Churn
