name: SMSML_Customer_Churn
conda_env: conda.yaml
entry_points:
  main:
    parameters:
      model_type: {type: string, default: RandomForestClassifier}
    command: "python membangun_model/modelling.py"
  tuning:
    parameters:
      n_iter: {type: int, default: 20}
    command: "python membangun_model/modelling_tuning.py"
