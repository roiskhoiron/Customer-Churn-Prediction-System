name: CI Advanced

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # MLflow tracking will use DagsHub (set by dagshub.init)
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/smsml_churn:latest

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    # 1. Set up job (implicit)
    # 2. Checkout repository (v3)
    - name: Checkout repository
      uses: actions/checkout@v3

    # 3. Set up Python 3.10
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. Install DVC (needed for data pull)
    - name: Install DVC
      run: |
        python -m pip install --upgrade pip
        pip install dvc[s3]  # s3 support if needed; adjust for other remotes

    # 5. Configure DVC remote authentication (DagsHub)
    - name: DVC remote auth (DagsHub)
      env:
        DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        dvc remote modify origin --local auth basic
        dvc remote modify origin --local user "$DAGSHUB_USERNAME"
        dvc remote modify origin --local password "$DAGSHUB_TOKEN"
        dvc remote default origin

    # 6. Pull dataset via DVC
    - name: Pull dataset
      run: |
        dvc pull

    # 7. Install MLProject dependencies
    - name: Install MLProject dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r MLProject/requirements.txt
        pip install dagshub==0.1.0  # ensures mlflow tracking works with DagsHub

    # 8. Run MLflow project (main entry)
    - name: Run MLflow project (main entry)
      run: |
        mlflow run . -e main -P model_type=RandomForestClassifier

    # 9. Get latest MLflow run ID
    - name: Get latest MLflow run ID
      id: get_run_id
      run: |
        RUN_ID=$(mlflow runs list -s "SMSML_Customer_Churn" --order-by "attributes.start_time DESC" -l 1 --no-verbose | tail -n 1 | awk '{print $1}')
        echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        echo "Latest run ID: $RUN_ID"

    # 10. Install Docker dependencies (if any additional needed)
    - name: Install Docker dependencies (optional)
      run: |
        pip install docker  # required for building image later

    # 11. Upload MLflow artifacts to GitHub (placeholder)
    - name: Upload artifacts to GitHub Release (placeholder)
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: ./mlruns

    # 12. Build Docker image
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }} .

    # 13. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 14. Push Docker image
    - name: Push Docker image
      run: |
        docker push ${{ env.DOCKER_IMAGE }}

    # 15. Logout Docker Hub (cleanup)
    - name: Logout Docker Hub
      run: docker logout

    # 16. Complete job (implicit)
