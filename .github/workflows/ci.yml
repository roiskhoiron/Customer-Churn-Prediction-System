name: CI Advanced

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Step 4: Check Env (example: ensure required env variables are set)
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/smsml_churn:latest

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    # 1. Set up job (implicit)
    # 2. Run actions/checkout@v3
    - name: Checkout repository
      uses: actions/checkout@v3

    # 3. Set up Python 3.12.7
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'

    # 4. Check Env
    - name: Verify environment variables
      run: |
        echo "Checking required environment variables..."
        if [ -z "$MLFLOW_TRACKING_URI" ]; then echo "MLFLOW_TRACKING_URI not set"; exit 1; fi
        echo "Environment OK"

    # 5. Install dependencies (MLProject requirements)
    - name: Install MLProject dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r MLProject/requirements.txt
        pip install mlflow==3.12.0 dagshub==0.1.0

    # 6. Run mlflow project
    - name: Run MLflow project (main entry)
      run: |
        mlflow run . -e main -P model_type=RandomForestClassifier

    # 7. Get latest MLflow run_id
    - name: Get latest MLflow run ID
      id: get_run_id
      run: |
        RUN_ID=$(mlflow runs list -s "SMSML_Customer_Churn" --order-by "attributes.start_time DESC" -l 1 --no-verbose | tail -n 1 | awk '{print $1}')
        echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        echo "Latest run ID: $RUN_ID"

    # 8. Install Python dependencies (again if needed for Docker build)
    - name: Install additional dependencies for Docker
      run: |
        pip install docker

    # 9. Upload to GitHub (replace Google Drive)
    - name: Upload artifacts to GitHub Release (placeholder)
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: ./mlruns

    # 10. Build Docker Model
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }} .

    # 11. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 12. Tag Docker Image (already tagged in build step)
    # 13. Push Docker Image
    - name: Push Docker image
      run: |
        docker push ${{ env.DOCKER_IMAGE }}

    # 14. Post Log in to Docker Hub (cleanup)
    - name: Logout Docker Hub
      run: docker logout

    # 15. Post Set up Python 3.12.7 (implicit cleanup)
    # 16. Post Run actions/checkout@v3 (implicit)
    # 17. Complete job (implicit)