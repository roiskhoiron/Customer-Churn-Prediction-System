name: CI Advanced

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # MLflow tracking will use DagsHub (set by dagshub.init)
  DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/smsml_churn:latest

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    # 1. Set up job (implicit)
    # 2. Checkout repository (v3)
    - name: Checkout repository
      uses: actions/checkout@v3

    # 3. Set up Python 3.10
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # DVC steps removed – data CSV is now committed to the repository directly.

    # 7. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r MLProject/requirements.txt
        pip install -r membangun_model/requirements.txt

    # 8. Run modelling.py (trains model & logs to DagsHub MLflow)
    - name: Run modelling script
      env:
        DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        python membangun_model/modelling.py

    # 9. Get latest MLflow run ID from DagsHub
    - name: Get latest MLflow run ID
      id: get_run_id
      env:
        DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        pip install mlflow
        python - <<'PY'
        import os
        from mlflow.tracking import MlflowClient
        os.environ['MLFLOW_TRACKING_URI'] = "https://dagshub.com/roiskhoiron/Customer-Churn-Prediction-System.mlflow"
        client = MlflowClient()
        exp = client.get_experiment_by_name('SMSML_Customer_Churn_Prediction')
        runs = client.search_runs([exp.experiment_id], max_results=1)
        if runs:
            print(f"run_id={runs[0].info.run_id}")
        PY

    # 10. Install Docker dependencies (if any additional needed)
    - name: Install Docker dependencies (optional)
      run: |
        pip install docker  # required for building image later

    # 11. Upload model artifacts to GitHub
    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-artifacts
        path: membangun_model/models/

    # 12. Build Docker image
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }} .

    # 13. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 14. Push Docker image
    - name: Push Docker image
      run: |
        docker push ${{ env.DOCKER_IMAGE }}

    # 15. Logout Docker Hub (cleanup)
    - name: Logout Docker Hub
      run: docker logout

    # 16. Complete job (implicit)
